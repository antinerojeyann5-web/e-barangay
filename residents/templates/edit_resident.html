<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resident - e-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-barangay { background-color: #003366 !important; }
        .text-barangay { color: #003366 !important; }
        .btn-barangay { background-color: #00509e; color: white; border: none; }
        .btn-barangay:hover { background-color: #003366; color: white; }
        .edit-card { max-width: 500px; margin: 60px auto; }
    </style>
</head>
<body class="bg-light">

    <div class="container">
        <div class="card shadow border-0 edit-card">
            <div class="card-header bg-barangay text-white text-center py-3">
                <h4 class="mb-0">✏️ Edit Resident</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold text-barangay">First Name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ resident.first_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-barangay">Last Name</label>
                        <input type="text" name="last_name" class="form-control" value="{{ resident.last_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-barangay">Age</label>
                        <input type="number" name="age" class="form-control" value="{{ resident.age }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-barangay">Address</label>
                        <input type="text" name="address" class="form-control" value="{{ resident.address }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-barangay">Contact Number</label>
                        <input type="text" name="contact_number" class="form-control" value="{{ resident.contact_number }}">
                    </div>
                    <button type="submit" class="btn btn-barangay w-100 py-2">Save Changes</button>
                    <a href="/" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
