<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications - e-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-barangay { background-color: #003366 !important; }
        .text-barangay { color: #003366 !important; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-barangay px-3 shadow-sm">
        <a class="navbar-brand text-white fw-bold" href="/">🏛️ e-Barangay</a>
        <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm">Back to Directory</a>
    </nav>

    <div class="container my-5">
        <h3 class="text-barangay fw-bold mb-4">🔔 Your Notifications</h3>
        
        {% for notif in notifications %}
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-body">
                    <p class="mb-1">{{ notif.message }}</p>
                    <small class="text-muted">{{ notif.created_at|date:"M d, Y h:i A" }}</small>
                </div>
            </div>
        {% empty %}
            <div class="alert alert-info">Wala kay bag-ong notifications.</div>
        {% endfor %}
    </div>

</body>
</html>
