<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - e-Barangay</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .bg-barangay { background-color: #003366 !important; }
        .text-barangay { color: #003366 !important; }
        .btn-barangay { background-color: #00509e; color: white; border: none; }
        .btn-barangay:hover { background-color: #003366; color: white; }
        .register-card { max-width: 500px; margin: 60px auto; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card shadow border-0 register-card">
            <div class="card-header bg-barangay text-white text-center py-3">
                <h4 class="mb-0">📝 Resident Registration</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-barangay w-100 py-2 mt-3">Create Account</button>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <small>Already have an account? <a href="{% url 'login' %}" class="text-barangay fw-bold">Log in here</a></small>
            </div>
        </div>
    </div>

</body>
</html>
