<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Complaint - e-Barangay</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #003366; text-align: center; }
        label { font-weight: bold; color: #003366; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #00509e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #003366; }
        a { display: block; text-align: center; margin-top: 15px; color: #00509e; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Submit a Complaint</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit Complaint</button>
        </form>
        <a href="{% url 'resident_dashboard' %}">Cancel</a>
    </div>
</body>
</html>
